name: Tests

# يعمل على الفروع الرئيسية وعلى كل طلب دمج نحوها.
# `feat/**` مُضاف حتى تُفحص الفروع قبل فتح طلب الدمج لا بعده: خطأ يُكتشف عند
# الدمج أغلى من خطأ يُكتشف عند الدفع.
on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyQt6 يربط مكتبات نظام لا تأتي مع حزمة pip. بلا libEGL كان استيراد
      # QApplication يفشل بـ ImportError: libEGL.so.1، فتُخفق كل اختبارات
      # الواجهة والإشعارات (26 خطأ) وإن كان الرمز سليماً. وضع offscreen لا
      # يرسم شيئاً لكن Qt يحمّل المكتبات عند الاستيراد على أي حال.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnotify-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # تشخيص يوضّح البيئة قبل الاختبارات: عامل CI بلا بطارية وبلا جلسة
      # مستخدم systemd، وهذه فروق تُفسّر أي تخطٍّ في النتائج.
      - name: Report environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import PyQt6.QtWidgets, psutil, sys; \
            print('PyQt6 و psutil يُستوردان'); \
            print('بطارية:', psutil.sensors_battery())"
          echo "systemd للمستخدم: $(systemctl --user is-system-running 2>&1 || true)"
          echo "setsid: $(command -v setsid || echo 'غير متوفّر')"

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          # عزل إعدادات المستخدم عن أي شيء على العامل
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: pytest -v --timeout=180
